<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geral de Controlo — EDPMUZIK</title>
    <style>
        :root { --bg-main: #111111; --bg-nav: #222222; --orange: #ff5500; --text-main: #eeeeee; --border: #333333; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 20px; }
        .grid-admin { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; max-w: 1400px; margin: 0 auto; }
        .box { background: var(--bg-nav); border: 1px solid var(--border); padding: 20px; border-radius: 8px; }
        h2 { color: var(--orange); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 18px; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-main); color: white; box-sizing: border-box; font-size: 14px; }
        button { background: var(--orange); border: none; font-weight: bold; cursor: pointer; color: white; }
        .stats-box { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-main); padding: 15px; border-radius: 4px; border: 1px solid var(--border); flex: 1; text-align: center; }
        .stat-card h3 { margin: 0; font-size: 24px; color: var(--orange); }
        .stat-card p { margin: 5px 0 0 0; font-size: 12px; color: #999; }
        .item-lista { background: var(--bg-main); padding: 12px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .item-lista img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; margin-right: 10px; border: 1px solid var(--border); }
        .btn-apagar { background: #d32f2f; width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
    </style>
</head>
<body>

    <h1 style="text-align:center; color:white; margin-bottom:30px;">☁️ CONTROLADOR DE PASTAS & SOUNDCLOUD CLONE</h1>

    <div class="grid-admin">
        <div>
            <div class="box">
                <h2>📁 Criar Pastas de Artistas / Colaboradores</h2>
                <form id="form-artista">
                    <input type="text" id="nome_artista" placeholder="Nome do Artista / Produtor" required>
                    <select id="categoria_artista">
                        <option value="Produtora">Artistas da Produtora</option>
                        <option value="Solo">Músicos a Solo</option>
                        <option value="Colaborador">Músicos Colaboradores</option>
                        <option value="Produtor">Produtores (Beats)</option>
                    </select>
                    <textarea id="bio_artista" placeholder="Biografia e informações do artista..." rows="3" required></textarea>
                    <button type="submit" style="background:#444;">Criar Pasta Virtual 📁</button>
                </form>
            </div>

            <div class="box" style="margin-top:20px;">
                <h2>🚀 Publicar no Site</h2>
                <form id="form-upload">
                    <input type="text" id="titulo" placeholder="Título (Música, Álbum, EP, Mixtape)" required>
                    
                    <label style="font-size:12px; color:#aaa;">Vincular à Pasta do Artista:</label>
                    <select id="artista_venculo" required></select>

                    <select id="tipo_projeto">
                        <option value="Música Solo">Música Solo</option>
                        <option value="EP">Projeto: EP</option>
                        <option value="Mixtape">Projeto: Mixtape</option>
                        <option value="Álbum">Projeto: Álbum</option>
                    </select>
                    <input type="url" id="link_capa" placeholder="Link Direto da Capa (do Postimages)" required>
                    <input type="url" id="link_arquivo" placeholder="Link Direto da Música (do Archive.org)" required>
                    <button type="submit">Subir Música Agora 🚀</button>
                </form>
            </div>
        </div>

        <div class="box">
            <h2>📊 Controle Geral EDPMUZIK</h2>
            <div class="stats-box">
                <div class="stat-card"><h3>2,941</h3><p>Visualizações do Site</p></div>
                <div class="stat-card"><h3 id="stat-projetos">0</h3><p>Músicas Online</p></div>
                <div class="stat-card"><h3 id="stat-artistas">0</h3><p>Pastas Criadas</p></div>
            </div>

            <h2>📁 Todas as Músicas no Ar</h2>
            <div id="lista-gerenciador"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            atualizarSelecaoArtistas();
            exibirItensGerenciador();
        });

        document.getElementById("form-artista").addEventListener("submit", function(e) {
            e.preventDefault();
            const nome = document.getElementById("nome_artista").value;
            const categoria = document.getElementById("categoria_artista").value;
            const bio = document.getElementById("bio_artista").value;

            let artistas = JSON.parse(localStorage.getItem("edp_artistas_v3") || "[]");
            artistas.push({ id: Date.now().toString(), nome, categoria, bio });
            localStorage.setItem("edp_artistas_v3", JSON.stringify(artistas));

            this.reset();
            atualizarSelecaoArtistas();
            exibirItensGerenciador();
        });

        function atualizarSelecaoArtistas() {
            const select = document.getElementById("artista_venculo");
            let artistas = JSON.parse(localStorage.getItem("edp_artistas_v3") || "[]");
            select.innerHTML = '<option value="EDPMUZIK">EDPMUZIK (Principal)</option>';
            artistas.forEach(art => {
                select.innerHTML += `<option value="${art.nome}">${art.nome} (${art.categoria})</option>`;
            });
        }

        document.getElementById("form-upload").addEventListener("submit", function(e) {
            e.preventDefault();
            const nomeArt = document.getElementById("artista_venculo").value;

            const novoItem = {
                id: Date.now().toString(),
                titulo: document.getElementById("titulo").value,
                artista: nomeArt,
                tipo: document.getElementById("tipo_projeto").value,
                capa_url: document.getElementById("link_capa").value,
                arquivo_url: document.getElementById("link_arquivo").value
            };

            let banco = JSON.parse(localStorage.getItem("edp_banco_v3") || "[]");
            banco.unshift(novoItem);
            localStorage.setItem("edp_banco_v3", JSON.stringify(banco));

            this.reset();
            exibirItensGerenciador();
        });

        function exibirItensGerenciador() {
            const lista = document.getElementById("lista-gerenciador");
            let banco = JSON.parse(localStorage.getItem("edp_banco_v3") || "[]");
            let artistas = JSON.parse(localStorage.getItem("edp_artistas_v3") || "[]");

            document.getElementById("stat-projetos").innerText = banco.length;
            document.getElementById("stat-artistas").innerText = artistas.length;
            lista.innerHTML = "";

            if (banco.length === 0) {
                lista.innerHTML = "<p style='color:#666; text-align:center;'>Nenhum projeto postado.</p>";
                return;
            }

            banco.forEach(item => {
                lista.innerHTML += `
                    <div class="item-lista">
                        <div style="display:flex; align-items:center;">
                            <img src="${item.capa_url}" onerror="this.src='https://unsplash.com'">
                            <div>
                                <strong style="color:white; display:block;">${item.titulo}</strong>
                                <span style="font-size:12px; color:#aaa;">${item.artista} [${item.tipo}]</span>
                            </div>
                        </div>
                        <button class="btn-apagar" onclick="apagarItem('${item.id}')">Apagar ❌</button>
                    </div>`;
            });
        }

        function apagarItem(id) {
            if (confirm("Remover do site?")) {
                let banco = JSON.parse(localStorage.getItem("edp_banco_v3") || "[]");
                banco = banco.filter(i => i.id !== id);
                localStorage.setItem("edp_banco_v3", JSON.stringify(banco));
                exibirItensGerenciador();
            }
        }
    </script>
</body>
</html>

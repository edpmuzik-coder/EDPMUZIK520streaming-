<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Geral — EDPMUZIK</title>
    <style>
        :root { --bg-main: #111111; --bg-nav: #222222; --orange: #ff5500; --text-main: #eeeeee; --border: #333333; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 20px; }
        .grid-admin { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; max-w: 1400px; margin: 0 auto; }
        .box { background: var(--bg-nav); border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        h2 { color: var(--orange); margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 18px; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-main); color: white; box-sizing: border-box; font-size: 14px; }
        button { background: var(--orange); border: none; font-weight: bold; cursor: pointer; color: white; }
        .item-lista { background: var(--bg-main); padding: 15px; margin-bottom: 15px; border-radius: 4px; border: 1px solid var(--border); }
        .item-topo { display: flex; align-items: center; justify-content: space-between; }
        .item-lista img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; margin-right: 12px; border: 1px solid var(--border); }
        .btn-apagar { background: #d32f2f; width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
        .btn-aprovar { background: #2e7d32; width: auto; padding: 6px 12px; font-size: 12px; margin: 0; }
        .tag-status { font-size: 11px; padding: 2px 6px; border-radius: 3px; font-weight: bold; text-transform: uppercase; margin-left: 5px; }
        .status-pendente { background: #f57c00; color: white; }
        .status-aprovado { background: #2e7d32; color: white; }
        .seletor-dinamico { border: 1px solid var(--orange); }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:white; margin-bottom:30px;">☁️ CONTROLADOR GERAL EDPMUZIK</h1>
    <div class="grid-admin">
        <div>
            <div class="box">
                <h2>📁 Criar Pasta de Artista</h2>
                <form id="form-artista">
                    <input type="text" id="nome_artista" placeholder="Nome do Artista ou Empresa" required>
                    <select id="categoria_artista">
                        <option value="Produtora">Artistas da Produtora</option>
                        <option value="Solo">Músicos a Solo</option>
                        <option value="Colaborador">Músicos Colaboradores</option>
                        <option value="Produtor">Produtores (Beats)</option>
                    </select>
                    <textarea id="bio_artista" placeholder="Biografia do artista..." rows="2" required></textarea>
                    <button type="submit" style="background:#444;">Criar Pasta 📁</button>
                </form>
            </div>
            <div class="box">
                <h2>🚀 Publicar no Site (Música, Vídeo ou Banner)</h2>
                <form id="form-upload">
                    <input type="text" id="titulo" placeholder="Título do Conteúdo" required>
                    <label style="font-size:12px; color:#aaa;">Pasta do Artista:</label>
                    <select id="artista_venculo" class="seletor-dinamico" required>
                        <option value="EDPMUZIK">EDPMUZIK (Pasta Principal)</option>
                    </select>
                    <select id="tipo_projeto" onchange="verificarTipo()">
                        <option value="Música Solo">Música Solo / Single</option>
                        <option value="EP">Projeto: EP</option>
                        <option value="Mixtape">Projeto: Mixtape</option>
                        <option value="Álbum">Projeto: Álbum</option>
                        <option value="Vídeo Clipe">Vídeo Clipe Musical</option>
                        <option value="Banner Publicidade">Banner de Publicidade</option>
                    </select>
                    <div id="campo-faixas" style="display:none;">
                        <input type="number" id="num_faixas" placeholder="Número de Faixas" min="1" value="1">
                    </div>
                    <input type="url" id="link_capa" placeholder="Link da Capa (Postimages)" required>
                    <input type="url" id="link_arquivo" placeholder="Link do MP3 (Archive) ou Vídeo (YouTube)" required>
                    <button type="submit">Enviar para Aprovação 🚀</button>
                </form>
            </div>
        </div>
        <div class="box">
            <h2>📁 Gerenciador de Lançamentos</h2>
            <div id="lista-gerenciador"></div>
        </div>
    </div>
    <script>
        async function chamarAPI(acao, dados = {}) {
            try {
                const res = await fetch('/api/store', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ acao, dados })
                });
                return await res.json();
            } catch (e) {
                let local = JSON.parse(localStorage.getItem("edp_v7_" + acao) || "[]");
                if (dados.id) { local.unshift(dados); localStorage.setItem("edp_v7_" + acao, JSON.stringify(local)); }
                return local;
            }
        }
        document.addEventListener("DOMContentLoaded", async () => {
            await atualizarSelecaoArtistas();
            await exibirItensGerenciador();
        });
        function verificarTipo() {
            const tipo = document.getElementById("tipo_projeto").value;
            document.getElementById("campo-faixas").style.display = (tipo === "EP" || tipo === "Mixtape" || tipo === "Álbum") ? "block" : "none";
        }
        document.getElementById("form-artista").addEventListener("submit", async function(e) {
            e.preventDefault();
            const nome = document.getElementById("nome_artista").value.trim();
            await chamarAPI('artistas', { id: Date.now().toString(), nome, categoria: document.getElementById("categoria_artista").value, bio: document.getElementById("bio_artista").value });
            alert("Pasta registrada!");
            this.reset();
            await atualizarSelecaoArtistas();
        });
        async function atualizarSelecaoArtistas() {
            const select = document.getElementById("artista_venculo");
            let artistas = await chamarAPI('get_artistas');
            select.innerHTML = '<option value="EDPMUZIK">EDPMUZIK (Pasta Principal)</option>';
            artistas.forEach(art => { select.innerHTML += `<option value="${art.nome}">${art.nome}</option>`; });
        }
        document.getElementById("form-upload").addEventListener("submit", async function(e) {
            e.preventDefault();
            let url = document.getElementById("link_arquivo").value;
            if(url.includes("watch?v=")) url = url.replace("watch?v=", "embed/");
            const novoItem = {
                id: Date.now().toString(),
                titulo: document.getElementById("titulo").value,
                artista: document.getElementById("artista_venculo").value,
                tipo: document.getElementById("tipo_projeto").value,
                faixas: document.getElementById("num_faixas").value || "1",
                capa_url: document.getElementById("link_capa").value,
                arquivo_url: url,
                aprovado: false
            };
            await chamarAPI('banco', novoItem);
            alert("Enviado para análise!");
            this.reset();
            await exibirItensGerenciador();
        });
        async function exibirItensGerenciador() {
            const lista = document.getElementById("lista-gerenciador");
            let banco = await chamarAPI('get_banco');
            lista.innerHTML = "";
            if (banco.length === 0) { lista.innerHTML = "<p style='color:#666;'>Nenhum item pendente.</p>"; return; }
            banco.forEach(item => {
                const statusTxt = item.aprovado ? "No Ar 🟢" : "Pendente 🟠";
                const statusCls = item.aprovado ? "status-aprovado" : "status-pendente";
                lista.innerHTML += `
                    <div class="item-lista">
                        <div class="item-topo">
                            <div style="display:flex; align-items:center;">
                                <img src="${item.capa_url}">
                                <div>
                                    <strong>${item.titulo}</strong>
                                    <span style="display:block;font-size:12px;color:#aaa;">${item.artista} [${item.tipo}]</span>
                                    <span class="tag-status ${statusCls}">${statusTxt}</span>
                                </div>
                            </div>
                            <div>
                                ${!item.aprovado ? `<button class="btn-aprovar" onclick="aprovarItem('${item.id}')">Aprovar 🟢</button>` : ''}
                                <button class="btn-apagar" onclick="apagarItem('${item.id}')">Apagar ❌</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
        async function aprovarItem(id) {
            let banco = await chamarAPI('get_banco');
            const item = banco.find(i => i.id === id);
            if (item) { 
                item.aprovado = true; 
                await fetch('/api/store', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao: 'salvar_tudo_banco', dados: banco }) });
                await exibirItensGerenciador(); 
            }
        }

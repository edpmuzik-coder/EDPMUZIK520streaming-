<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Google Drive — EDPMUZIK</title>
    <style>
        :root { --bg-main: #111111; --bg-nav: #222222; --orange: #ff5500; --text-main: #eeeeee; --border: #333333; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; padding: 20px; text-align: center; }
        .admin-box { background: var(--bg-nav); border: 1px solid var(--border); max-width: 450px; margin: 30px auto; padding: 25px; border-radius: 8px; text-align: left; }
        .admin-box h2 { color: var(--orange); text-align: center; margin-top: 0; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-main); color: white; box-sizing: border-box; }
        button { background: var(--orange); border: none; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 15px; }
        .success-msg { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 12px; border-radius: 4px; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2>☁️ Painel EDPMUZIK (Edge Config)</h2>
        <div id="msg-sucesso" class="success-msg">🚀 Publicado com sucesso no Banco de Dados!</div>
        <form id="form-upload">
            <input type="text" id="titulo" placeholder="Título do Conteúdo" required>
            <input type="text" id="artista" placeholder="Artista / Anunciante" required>
            <select id="tipo_projeto">
                <option value="Música Solo">Música Solo</option>
                <option value="EP">Projeto: EP</option>
                <option value="Mixtape">Projeto: Mixtape</option>
                <option value="Álbum">Projeto: Álbum</option>
                <option value="Publicidade">Vídeo / Publicidade</option>
            </select>
            <input type="url" id="link_capa" placeholder="Link da Capa/Foto no Google Drive" required>
            <input type="url" id="link_arquivo" placeholder="Link do MP3 ou Vídeo no Google Drive" required>
            <button type="submit">Publicar Lançamento 🚀</button>
        </form>
    </div>
    <script>
        function extrairIDDrive(url) {
            const regExp = /\/file\/d\/([a-zA-Z0-9-_]+)/;
            const match = url.match(regExp);
            return match ? match[1] : url;
        }

        document.getElementById("form-upload").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const novoItem = {
                id: Date.now().toString(),
                titulo: document.getElementById("titulo").value,
                artista: document.getElementById("artista").value,
                tipo: document.getElementById("tipo_projeto").value,
                capa_id: extrairIDDrive(document.getElementById("link_capa").value),
                arquivo_id: extrairIDDrive(document.getElementById("link_arquivo").value)
            };

            // Salva no banco de dados Edge Config localmente para o site ler de forma estável
            let banco = JSON.parse(localStorage.getItem("edp_edge_store") || "[]");
            banco.unshift(novoItem);
            localStorage.setItem("edp_edge_store", JSON.stringify(banco));

            document.getElementById("msg-sucesso").style.display = "block";
            this.reset();
            setTimeout(() => { document.getElementById("msg-sucesso").style.display = "none"; }, 4000);
        });
    </script>
</body>
</html>

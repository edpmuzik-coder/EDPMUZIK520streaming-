<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - EDPMUZIK</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; background: #222; color: #fff; border: 1px solid #444; box-sizing: border-box; }
        button { background: #ff5500; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
        .update-btn { background: #00b359; font-size: 1.2em; margin-top: 20px; }
        .folder-badge { background: #333; padding: 8px; margin: 5px; border-radius: 4px; display: inline-block; border-left: 3px solid #ff5500; }
        .preview-card { background: #222; padding: 10px; margin: 10px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <h1>EDPMUZIK - Painel Administrativo</h1>

    <!-- 1. CRIAR PASTAS -->
    <div class="box">
        <h2>1. Criar Nova Pasta (Álbum / EP)</h2>
        <input type="text" id="nomePasta" placeholder="Nome da Pasta">
        <button type="button" id="btnCriarPasta">📁 Criar Pasta de Projeto</button>
        
        <h3>Pastas Criadas:</h3>
        <div id="lista-pastas"></div>
    </div>

    <!-- 2. SUBIR MÚSICAS -->
    <div class="box">
        <h2>2. Subir Música por Link</h2>
        <input type="text" id="titulo" placeholder="Título">
        <input type="text" id="artista" placeholder="Músico">
        
        <label>Pasta Alvo:</label>
        <select id="selectPasta">
            <option value="Música Solo">Música Solo (Sem Pasta)</option>
        </select>

        <input type="text" id="linkAudio" placeholder="Link do Áudio MP3">
        <input type="text" id="linkCapa" placeholder="Link da Capa">
        <button type="button" id="btnSubirMusica">🎵 Carregar para Monitorização</button>
    </div>

    <!-- 3. ÁREA DE MONITORIZAÇÃO -->
    <div class="box">
        <h2>Área de Monitorização</h2>
        <div id="lista-rascunhos"></div>
    </div>

    <button type="button" class="update-btn" id="btnPublicar">🔄 ATUALIZAR PARA A PÁGINA INICIAL</button>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let pastas = JSON.parse(localStorage.getItem('edp_pastas')) || [];
            let rascunhos = JSON.parse(localStorage.getItem('edp_rascunhos')) || [];

            const btnCriarPasta = document.getElementById('btnCriarPasta');
            const btnSubirMusica = document.getElementById('btnSubirMusica');
            const btnPublicar = document.getElementById('btnPublicar');

            btnCriarPasta.addEventListener('click', function(e) {
                e.preventDefault();
                const nome = document.getElementById('nomePasta').value.trim();
                if (!nome) return alert('Insira o nome da pasta!');

                pastas.push({ id: Date.now(), nome: nome });
                localStorage.setItem('edp_pastas', JSON.stringify(pastas));
                
                document.getElementById('nomePasta').value = '';
                render();
                alert('Pasta criada com sucesso!');
            });

            btnSubirMusica.addEventListener('click', function(e) {
                e.preventDefault();
                const titulo = document.getElementById('titulo').value.trim();
                const artista = document.getElementById('artista').value.trim();
                const pasta = document.getElementById('selectPasta').value;
                const audio = document.getElementById('linkAudio').value.trim();
                const capa = document.getElementById('linkCapa').value.trim();

                if (!titulo || !artista || !audio || !capa) return alert('Preencha todos os campos!');

                rascunhos.push({
                    id: Date.now(), titulo: titulo, artista: artista, tipoProjeto: pasta, linkAudio: audio, linkCapa: capa
                });

                localStorage.setItem('edp_rascunhos', JSON.stringify(rascunhos));
                
                document.getElementById('titulo').value = '';
                document.getElementById('artista').value = '';
                document.getElementById('linkAudio').value = '';
                document.getElementById('linkCapa').value = '';
                
                render();
                alert('Música enviada para a Área de Monitorização!');
            });

            btnPublicar.addEventListener('click', function(e) {
                e.preventDefault();
                let publicados = JSON.parse(localStorage.getItem('edp_publicado')) || [];
                localStorage.setItem('edp_publicado', JSON.stringify([...publicados, ...rascunhos]));
                localStorage.setItem('edp_rascunhos', JSON.stringify([]));
                rascunhos = [];
                render();
                alert('Site Atualizado com Sucesso para os Ouvintes!');
            });

            function render() {
                const boxPastas = document.getElementById('lista-pastas');
                boxPastas.innerHTML = '';
                pastas.forEach(p => {
                    boxPastas.innerHTML += `<div class="folder-badge">📁 ${p.nome}</div>`;
                });

                const selectPasta = document.getElementById('selectPasta');
                selectPasta.innerHTML = '<option value="Música Solo">Música Solo (Sem Pasta)</option>';
                pastas.forEach(p => {
                    selectPasta.innerHTML += `<option value="${p.nome}">${p.nome}</option>`;
                });

                const boxRascunhos = document.getElementById('lista-rascunhos');
                boxRascunhos.innerHTML = '';
                rascunhos.forEach(r => {
                    boxRascunhos.innerHTML += `
                        <div class="preview-card">
                            <div><strong>${r.titulo}</strong> - ${r.artista} (Pasta: ${r.tipoProjeto})</div>
                            <audio src="${r.linkAudio}" controls style="height:28px;"></audio>
                        </div>`;
                });
            }

            render();
        });
    </script>
</body>
</html>

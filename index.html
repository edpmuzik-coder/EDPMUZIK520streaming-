<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDPMUZIK520streaming — Discover</title>
    <style>
        :root {
            --bg-main: #111111;
            --bg-nav: #222222;
            --orange: #ff5500;
            --text-main: #eeeeee;
            --text-muted: #999999;
            --border: #333333;
        }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; }
        
        /* Barra Superior Estilo SoundCloud */
        nav { background: var(--bg-nav); height: 50px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); position: fixed; width: 100%; top: 0; z-index: 100; box-sizing: border-box; }
        nav .logo { font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; font-size: 16px; margin-right: 30px; }
        nav .logo span { color: var(--orange); }
        nav .menu-links { display: flex; gap: 20px; font-size: 14px; font-weight: 500; }
        nav .menu-links a { color: var(--text-muted); text-decoration: none; }
        nav .menu-links a.active { color: white; border-bottom: 4px solid var(--orange); padding-bottom: 13px; }

        .container { max-width: 1240px; margin: 80px auto 40px auto; padding: 0 20px; text-align: left; }
        
        h2 { font-size: 22px; font-weight: 700; margin: 30px 0 15px 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        /* Grelha de Conteúdo e Capas Quadradas */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .card { background: transparent; }
        .card .cover-art { width: 100%; aspect-ratio: 1/1; background: #222; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; }
        .card .cover-art img { width: 100%; height: 100%; object-fit: cover; }
        .card h3 { font-size: 14px; margin: 8px 0 2px 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card p { font-size: 12px; color: var(--text-muted); margin: 0; }
        audio { width: 100%; margin-top: 8px; height: 30px; }

        /* Painel de Upload SoundCloud Style */
        .admin-box { background: var(--bg-nav); border: 1px solid var(--border); max-width: 450px; margin: 50px auto; padding: 25px; border-radius: 8px; box-sizing: border-box; }
        .admin-box h2 { color: var(--orange); border: none; margin-top: 0; font-size: 18px; padding: 0; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-main); color: white; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: var(--orange); outline: none; }
        label { font-size: 12px; color: var(--text-muted); display: block; margin-top: 10px; }
        button { background: var(--orange); border: none; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 15px; }
        button:hover { background: #e04b00; }
        
        .success-msg { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 12px; border-radius: 4px; margin-bottom: 15px; display: none; font-size: 14px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Barra de Navegação Superior -->
    <nav>
        <div class="logo">☁️ <span>EDPMUZIK</span></div>
        <div class="menu-links">
            <a href="#" class="active">Home</a>
            <a href="#">Feed</a>
            <a href="#">Library</a>
        </div>
    </nav>

    <div class="container">
        
        <h2>Curated by EDPMUZIK</h2>
        <div class="grid" id="lista-musicas">
            <!-- Música Demonstrativa Fictícia -->
            <div class="card">
                <div class="cover-art">
                    <img src="https://unsplash.com" alt="Capa">
                </div>
                <h3>Lançamento Principal</h3>
                <p>EDPMUZIK</p>
                <audio controls></audio>
            </div>
        </div>

        <h2>Trending by genre</h2>
        <div class="grid">
            <div class="card"><div class="cover-art"></div><h3>Hip-Hop & Rap</h3><p>Trending tracks</p></div>
            <div class="card"><div class="cover-art"></div><h3>Trap beats</h3><p>Fresh list</p></div>
            <div class="card"><div class="cover-art"></div><h3>Afro House</h3><p>Global rhythms</p></div>
        </div>

        <!-- PAINEL DE CONTROL INTERNO (Netlify Forms) -->
        <div class="admin-box">
            <h2>☁️ Painel de Upload (Estilo SoundCloud)</h2>
            
            <!-- Aviso Verde de Sucesso -->
            <div id="msg-sucesso" class="success-msg">🚀 Música e Capa enviadas com sucesso para o Netlify!</div>
            
            <form name="upload-musicas" method="POST" data-netlify="true" enctype="multipart/form-data" id="form-upload">
                <input type="text" name="titulo" placeholder="Título da Música" required>
                <input type="text" name="artista" placeholder="Nome do Artista" required>
                
                <label>Imagem de Capa Quadrada (JPG/PNG):</label>
                <input type="file" name="imagem_capa" accept="image/*" required>
                
                <label>Arquivo de Áudio (.mp3):</label>
                <input type="file" name="arquivo_audio" accept="audio/mp3" required>
                
                <button type="submit">Upload para o SoundCloud Clone</button>
            </form>
        </div>

    </div>

    <script>
        // Envia os arquivos e impede o erro 404
        document.getElementById("form-upload").addEventListener("submit", function(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            
            // Permite ao Netlify agrupar os ficheiros na pasta correta
            formData.append("form-name", "upload-musicas");
            
            fetch("/", {
                method: "POST",
                body: formData
            })
            .then(() => {
                document.getElementById("msg-sucesso").style.display = "block";
                form.reset();
                setTimeout(() => { document.getElementById("msg-sucesso").style.display = "none"; }, 5000);
            })
            .catch(() => {
                alert("Erro ao realizar o upload.");
            });
        });
    </script>

</body>
</html>

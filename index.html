<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDPMUZIK520streaming — SoundCloud Clone</title>
    <style>
        :root {
            --bg-main: #111111;
            --bg-nav: #222222;
            --orange: #ff5500;
            --text-main: #eeeeee;
            --text-muted: #999999;
            --border: #333333;
        }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; }
        nav { background: var(--bg-nav); height: 50px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); position: fixed; width: 100%; top: 0; z-index: 100; box-sizing: border-box; }
        nav .logo { font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; font-size: 16px; margin-right: 30px; }
        nav .logo span { color: var(--orange); }
        .tabs { display: flex; gap: 20px; margin-right: auto; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; padding-bottom: 13px; }
        .tab-btn.active { color: white; border-bottom: 4px solid var(--orange); }
        .container { max-width: 1240px; margin: 80px auto 40px auto; padding: 0 20px; text-align: left; }
        h2 { font-size: 22px; font-weight: 700; margin: 30px 0 15px 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .card { background: transparent; position: relative; }
        .card .cover-art { width: 100%; aspect-ratio: 1/1; background: #222; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; }
        .card .cover-art img { width: 100%; height: 100%; object-fit: cover; }
        .card h3 { font-size: 14px; margin: 8px 0 2px 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card p { font-size: 12px; color: var(--text-muted); margin: 0; }
        .card .type-badge { font-size: 10px; text-transform: uppercase; color: var(--orange); font-weight: bold; margin-bottom: 4px; display: block; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); color: #ff3333; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; z-index: 10; }
        audio { width: 100%; margin-top: 8px; height: 30px; }
        .admin-box { background: var(--bg-nav); border: 1px solid var(--border); max-width: 500px; margin: 50px auto; padding: 25px; border-radius: 8px; box-sizing: border-box; }
        .admin-box h2 { color: var(--orange); border: none; margin-top: 0; font-size: 18px; padding: 0; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-main); color: white; box-sizing: border-box; font-size: 14px; }
        button { background: var(--orange); border: none; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 15px; }
        button:hover { background: #e04b00; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">☁️ <span>EDPMUZIK</span></div>
        <div class="tabs">
            <button class="tab-btn active" onclick="filtrar('tudo')">Tudo</button>
            <button class="tab-btn" onclick="filtrar('single')">Singles</button>
            <button class="tab-btn" onclick="filtrar('album')">Álbuns & EPs</button>
            <button class="tab-btn" onclick="filtrar('mixtape')">Mixtapes</button>
        </div>
    </nav>

    <div class="container">
        <h2>Lançamentos Recentes</h2>
        <div class="grid" id="lista-musicas"></div>

        <div class="admin-box">
            <h2>☁️ Painel de Publicação por Links (Google Drive)</h2>
            <form id="form-link-upload" onsubmit="publicarMusica(event)">
                <input type="text" id="titulo" placeholder="Título do Lançamento" required>
                <input type="text" id="artista" placeholder="Nome do Artista" required>
                <select id="tipo" required>
                    <option value="single">Single (Música Sola)</option>
                    <option value="album">Álbum / EP</option>
                    <option value="mixtape">Mixtape Oficial</option>
                </select>
                <input type="url" id="link-foto" placeholder="Link direto da Imagem de Capa (Google Drive)" required>
                <input type="url" id="link-audio" placeholder="Link direto do Áudio .mp3 (Google Drive)" required>
                <button type="submit">🚀 Publicar no Site Agora</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", mostrarMusicas);

        function publicarMusica(e) {
            e.preventDefault();
            const novaMusica = {
                id: Date.now(),
                titulo: document.getElementById("titulo").value,
                artista: document.getElementById("artista").value,
                tipo: document.getElementById("tipo").value,
                foto: document.getElementById("link-foto").value,
                audio: document.getElementById("link-audio").value
            };
            let musicasSalvas = localStorage.getItem("musicas") ? JSON.parse(localStorage.getItem("musicas")) : [];
            musicasSalvas.push(novaMusica);
            localStorage.setItem("musicas", JSON.stringify(musicasSalvas));
            document.getElementById("form-link-upload").reset();
            mostrarMusicas();
        }

        function mostrarMusicas() {
            const lista = document.getElementById("lista-musicas");
            lista.innerHTML = "";
            let musicasSalvas = localStorage.getItem("musicas") ? JSON.parse(localStorage.getItem("musicas")) : [];
            if (musicasSalvas.length === 0) {
                lista.innerHTML = `<p style="color: #666; grid-column: 1/-1;">Nenhum projeto publicado ainda.</p>`;
                return;
            }
            musicasSalvas.forEach(musica => {
                lista.innerHTML += `
                    <div class="card" data-tipo="${musica.tipo}">
                        <button class="delete-btn" onclick="apagarMusica(${musica.id})">Apagar</button>
                        <div class="cover-art"><img src="${musica.foto}"></div>
                        <span class="type-badge">${musica.tipo}</span>
                        <h3>${musica.titulo}</h3>
                        <p>${musica.artista}</p>
                        <audio controls src="${musica.audio}"></audio>
                    </div>
                `;
            });
        }

        function apagarMusica(id) {
            let musicasSalvas = JSON.parse(localStorage.getItem("musicas"));
            musicasSalvas = musicasSalvas.filter(m => m.id !== id);
            localStorage.setItem("musicas", JSON.stringify(musicasSalvas));
            mostrarMusicas();
        }

        function filtrar(categoria) {
            const botoes = document.querySelectorAll(".tab-btn");
            botoes.forEach(b => b.classList.remove("active"));
            event.currentTarget.classList.add("active");
            const cards = document.querySelectorAll(".card");
            cards.forEach(card => {
                if (categoria === "tudo" || card.getAttribute("data-tipo") === categoria) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>

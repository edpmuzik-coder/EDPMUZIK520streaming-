<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - EDPMUZIK</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 20px; }
        .box { background: #222; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 4px; border: none; }
        button { background: #ff5500; color: white; font-weight: bold; cursor: pointer; }
        button.update-btn { background: #00b359; font-size: 1.2em; margin-top: 20px; }
        .preview-card { background: #333; padding: 10px; margin: 5px 0; border-left: 5px solid #ff5500; }
    </style>
</head>
<body>

    <h1>Painel de Controle Administrativo</h1>
    
    <!-- Estatísticas de Monitorização -->
    <div class="box">
        <h2>Monitorização em Tempo Real</h2>
        <p>Total de Músicas (Rascunho): <span id="count-musicas">0</span></p>
        <p>Total de Pastas/Projetos: <span id="count-pastas">0</span></p>
    </div>

    <!-- Formulário de Upload por Link -->
    <div class="box">
        <h2>Subir Novo Conteúdo (Via Link)</h2>
        <input type="text" id="titulo" placeholder="Título da Música/Vídeo">
        <input type="text" id="artista" placeholder="Nome do Músico">
        
        <select id="tipoArtista">
            <option value="Produtora">Músico da Produtora</option>
            <option value="Colaborador">Músico Colaborador</option>
            <option value="Independente">Músico Independente</option>
        </select>

        <select id="tipoProjeto">
            <option value="Solo">Música Solo</option>
            <option value="EP">EP</option>
            <option value="Mixtape">MIXTAPE</option>
            <option value="Album">ÁLBUM</option>
        </select>

        <input type="text" id="linkAudio" placeholder="Link do Áudio (Ex: https://archive.org)">
        <input type="text" id="linkCapa" placeholder="Link da Capa (Ex: https://postimg.cc/...)">
        <input type="text" id="linkYoutube" placeholder="Link do Vídeo de Publicidade (YouTube) se houver">
        <textarea id="biografia" placeholder="Biografia do Músico" rows="3" style="width:100%;"></textarea>
        
        <button onclick="adicionarRascunho()">Adicionar ao Rascunho para Teste</button>
    </div>

    <!-- Área de Monitorização e Pré-visualização -->
    <div class="box">
        <h2>Área de Teste (Ouvir e Assistir Antes de Publicar)</h2>
        <div id="lista-rascunhos"></div>
    </div>

    <!-- Botão de Atualização Crítica -->
    <button class="update-btn" onclick="atualizarPaginaInicial()">🔄 ATUALIZAR PARA A PÁGINA INICIAL</button>

    <script>
        let rascunhos = JSON.parse(localStorage.getItem('edp_rascunhos')) || [];

        function atualizarContadores() {
            document.getElementById('count-musicas').innerText = rascunhos.length;
            let pastas = [...new Set(rascunhos.map(item => item.tipoProjeto))];
            document.getElementById('count-pastas').innerText = pastas.length;
        }

        function adicionarRascunho() {
            const novoItem = {
                id: Date.now(),
                titulo: document.getElementById('titulo').value,
                artista: document.getElementById('artista').value,
                tipoArtista: document.getElementById('tipoArtista').value,
                tipoProjeto: document.getElementById('tipoProjeto').value,
                linkAudio: document.getElementById('linkAudio').value,
                linkCapa: document.getElementById('linkCapa').value,
                linkYoutube: document.getElementById('linkYoutube').value,
                biografia: document.getElementById('biografia').value,
                streams: 0,
                downloads: 0,
                gostos: 0,
                comentarios: []
            };

            rascunhos.push(novoItem);
            localStorage.setItem('edp_rascunhos', JSON.stringify(rascunhos));
            renderRascunhos();
            atualizarContadores();
            alert('Item adicionado à área de monitorização!');
        }

        function renderRascunhos() {
            const container = document.getElementById('lista-rascunhos');
            container.innerHTML = '';
            rascunhos.forEach(item => {
                container.innerHTML += `
                    <div class="preview-card">
                        <h3>${item.titulo} - ${item.artista} (${item.tipoProjeto})</h3>
                        <p><strong>Categoria:</strong> ${item.tipoArtista}</p>
                        <img src="${item.linkCapa}" width="60" style="border-radius:4px;"><br>
                        <audio src="${item.linkAudio}" controls style="margin-top:5px;"></audio>
                        ${item.linkYoutube ? `<br><small>Link YouTube: ${item.linkYoutube}</small>` : ''}
                    </div>
                `;
            });
        }

        function atualizarPaginaInicial() {
            // Transfere o rascunho aprovado para a base de dados pública do site
            localStorage.setItem('edp_publicado', JSON.stringify(rascunhos));
            alert('Sucesso! Todo o conteúdo foi publicado na Página Inicial dos Ouvintes.');
        }

        // Inicializar
        renderRascunhos();
        atualizarContadores();
    </script>
</body>
</html>

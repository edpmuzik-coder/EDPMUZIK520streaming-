<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDPMUZIK520streaming — Discover</title>
    <style>
        :root { --bg-main: #111111; --bg-nav: #222222; --orange: #ff5500; --text-main: #eeeeee; --text-muted: #999999; --border: #333333; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; }
        nav { background: var(--bg-nav); height: 50px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); position: fixed; width: 100%; top: 0; z-index: 100; box-sizing: border-box; }
        nav .logo { font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; font-size: 16px; margin-right: 30px; }
        nav .logo span { color: var(--orange); }
        .container { max-width: 1240px; margin: 80px auto 40px auto; padding: 0 20px; }
        h2 { font-size: 22px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .card { background: var(--bg-nav); padding: 15px; border-radius: 6px; border: 1px solid var(--border); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 4px; }
        .card h3 { font-size: 15px; margin: 10px 0 2px 0; truncate; }
        .card p { font-size: 12px; color: var(--text-muted); margin: 0 0 10px 0; }
        .tag { background: var(--orange); color: black; font-weight: bold; font-size: 10px; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
        iframe { width: 100%; border: none; border-radius: 4px; background: #000; }
    </style>
</head>
<body>
    <nav><div class="logo">☁️ <span>EDPMUZIK</span></div></nav>
    <div class="container">
        <h2>Músicas e Projetos</h2>
        <div class="grid" id="lista-musicas"></div>

        <h2>Vídeos e Publicidades</h2>
        <div class="grid" id="lista-videos"></div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", exibirConteudo);

        function exibirConteudo() {
            const listaMusicas = document.getElementById("lista-musicas");
            const listaVideos = document.getElementById("lista-videos");
            let banco = JSON.parse(localStorage.getItem("edp_drive_streaming_v2") || "[]");

            listaMusicas.innerHTML = "";
            listaVideos.innerHTML = "";

            let temMusica = false, temVideo = false;

            banco.forEach(item => {
                if (item.tipo === "Publicidade") {
                    temVideo = true;
                    listaVideos.innerHTML += `
                        <div class="card">
                            <iframe src="https://google.com{item.arquivo_id}/preview" height="200" allow="autoplay"></iframe>
                            <h3>${item.titulo}</h3>
                            <p>${item.artista} • <span class="tag">${item.tipo}</span></p>
                        </div>`;
                } else {
                    temMusica = true;
                    listaMusicas.innerHTML += `
                        <div class="card">
                            <img src="https://google.com{item.capa_id}" onerror="this.src='https://unsplash.com'">
                            <h3>${item.titulo}</h3>
                            <p>${item.artista} • <span class="tag">${item.tipo}</span></p>
                            <!-- Player Incorporado Seguro do Google Drive -->
                            <iframe src="https://google.com{item.arquivo_id}/preview" height="60"></iframe>
                        </div>`;
                }
            });

            if (!temMusica) listaMusicas.innerHTML = "<p>Nenhuma música enviada.</p>";
            if (!temVideo) listaVideos.innerHTML = "<p>Nenhum vídeo enviado.</p>";
        }
    </script>
</body>
</html>

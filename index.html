<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDPMUZIK520 Streaming</title>
    <style>
        body { background-color: #111111; color: #eeeeee; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .painel { max-width: 450px; margin: 20px auto; background: #222222; padding: 20px; border-radius: 10px; border: 1px solid #ff5500; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #333; background: #111; color: white; }
        button { background: #ff5500; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #e04400; }
        .grid-musicas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-w: 1000px; margin: 40px auto 0 auto; }
        .card { background: #222222; padding: 15px; border-radius: 10px; border: 1px solid #333; text-align: left; }
        .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; }
        .tag { display: inline-block; background: #ff5500; padding: 3px 8px; border-radius: 5px; font-size: 12px; margin: 10px 0; text-transform: uppercase; font-weight: bold; color: black; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>EDPMUZIK520 STREAMING</h1>

    <!-- ⚡ PAINEL DE UPLOAD DIRETO POR ARQUIVOS -->
    <div class="painel">
        <h3>Painel de Publicação Rápida</h3>
        <p style="font-size: 13px; color: #999;">Selecione os arquivos direto do seu dispositivo</p>
        
        <form name="streaming-uploads" method="POST" data-netlify="true" enctype="multipart/form-data">
            <input type="text" name="titulo" placeholder="Título do Lançamento" required>
            
            <select name="categoria">
                <option value="Single">Single / Música Solo</option>
                <option value="EP">Projeto: EP</option>
                <option value="Mixtape">Projeto: Mixtape</option>
                <option value="Álbum">Projeto: Álbum</option>
            </select>

            <label style="display:block; text-align:left; font-size:12px; color:#aaa;">Foto da Capa:</label>
            <input type="file" name="foto_capa" accept="image/*" required>

            <label style="display:block; text-align:left; font-size:12px; color:#aaa;">Arquivo de Áudio (MP3):</label>
            <input type="file" name="audio_musica" accept="audio/*" required>

            <button type="submit">Subir Música Agora 🚀</button>
        </form>
    </div>

    <!-- 🎵 ÁREA DOS LANÇAMENTOS -->
    <div class="grid-musicas" id="feed">
        <!-- Música de exemplo demonstrativa -->
        <div class="card">
            <img src="https://postimages.org" alt="Capa">
            <span class="tag">Single</span>
            <h3 style="margin:5px 0;">master rrr</h3>
            <p style="margin:0; color:#999;">EDPMUZIK</p>
            <audio src="" controls></audio>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDPMUZIK520streaming — Discover</title>
    <style>
        :root { --bg-main: #111111; --bg-nav: #222222; --orange: #ff5500; --text-main: #eeeeee; --text-muted: #999999; --border: #333333; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; padding-bottom: 90px; }
        nav { background: var(--bg-nav); height: 50px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); position: fixed; width: 100%; top: 0; z-index: 100; box-sizing: border-box; }
        nav .logo { font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; font-size: 16px; margin-right: 30px; }
        nav .logo span { color: var(--orange); }
        .container { max-width: 1240px; margin: 80px auto 40px auto; padding: 0 20px; }
        h2 { font-size: 22px; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 40px; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .grid-banners { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: transparent; cursor: pointer; position: relative; }
        .cover-container { width: 100%; aspect-ratio: 1/1; background: #222; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; position: relative; }
        .cover-container img { width: 100%; height: 100%; object-fit: cover; }
        .hover-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; }
        .card:hover .hover-overlay { opacity: 1; }
        .play-btn-icon { background: var(--orange); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; border: none; cursor: pointer; }
        .card h3 { font-size: 14px; margin: 8px 0 2px 0; font-weight: 600; }
        .card p { font-size: 12px; color: var(--text-muted); margin: 0; }
        .tag { background: var(--orange); color: black; font-weight: bold; font-size: 10px; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; display: inline-block; margin-top: 4px; }
        .banner-card { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--bg-nav); }
        .banner-card img { width: 100%; height: 160px; object-fit: cover; }
        .banner-info { padding: 10px; }
        .footer-player { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: #222; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 1000; display: none; }
        .player-info { display: flex; align-items: center; width: 25%; }
        .player-info img { width: 45px; height: 45px; object-fit: cover; border-radius: 3px; margin-right: 12px; }
        .player-controls { width: 50%; display: flex; flex-direction: column; align-items: center; }
        audio { width: 100%; height: 32px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; align-items: center; justify-content: center; display: none; }
        .modal-content { background: #1e1e1e; width: 90%; max-width: 700px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { background: #282828; padding: 20px; display: flex; gap: 20px; border-bottom: 1px solid var(--border); position: relative; }
        .modal-header img { width: 120px; height: 120px; object-fit: cover; border-radius: 4px; }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; color: var(--text-muted); cursor: pointer; border: none; background: transparent; }
        .action-bar { padding: 15px 20px; background: #1a1a1a; border-bottom: 1px solid var(--border); }
        .btn-download { background: var(--orange); color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 13px; }
        .modal-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <nav><div class="logo">☁️ <span>EDPMUZIK</span></div></nav>
    <div class="container">
        <h2>📢 Banners de Publicidade</h2>
        <div class="grid-banners" id="seccao-banners"></div>
        <h2>🎵 Músicas, EPs e Álbuns</h2>

        <h2>🎥 Clipes e Vídeos Publicitários</h2>
        <div class="grid" id="seccao-videos"></div>

    <div class="footer-player" id="global-player">

            </div>
            <div class="action-bar"><a id="btn-down-link" href="#" target="_blank" class="btn-download">⬇️ Fazer Download</a></div>
            <div class="modal-body">
                <div><h4>📄 Informações / Pasta</h4><p id="m-bio"></p></div>
                <div><h4>📊 Estatísticas</h4><p>👁️ <span id="m-views">0</span> visitas</p></div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", exibirConteudo);
        function exibirConteudo() {
            const sBanners = document.getElementById("seccao-banners");
            const sMusicas = document.getElementById("seccao-musicas");
            const sVideos = document.getElementById("seccao-videos");
            let banco = JSON.parse(localStorage.getItem("edp_banco_v4") || "[]");
            let aprovados = banco.filter(i => i.aprovado === true);
            sBanners.innerHTML = ""; sMusicas.innerHTML = ""; sVideos.innerHTML = "";
            if (aprovados.length === 0) {
                sMusicas.innerHTML = "<p style='color:#666;'>Aguardando aprovação de conteúdos pelo administrador...</p>";
                return;
            }
            banco.forEach((item, index) => {
                if (item.aprovado) {
                    if (item.tipo === "Banner Publicidade") {
                        sBanners.innerHTML += `
                            <div class="banner-card">
                                <img src="${item.capa_url}">
                                <div class="banner-info"><h3>${item.titulo}</h3><p>${item.artista}</p></div>
                            </div>`;
                    } else if (item.tipo.includes("Vídeo")) {
                        sVideos.innerHTML += `
                            <div class="card" style="width:100%;">
                                <iframe src="${item.arquivo_url}" style="width:100%; aspect-ratio:16/9; border-radius:4px; border:1px solid #333;" allowfullscreen></iframe>
                                <h3 style="font-size:14px; margin:5px 0;">${item.titulo}</h3>
                                <p style="font-size:12px; color:#aaa;">${item.artista} <span class="tag">${item.tipo}</span></p>
                            </div>`;
                    } else {
                        const txtF = item.tipo === "Música Solo" ? "" : ` (${item.faixas} Faixas)`;
                        sMusicas.innerHTML += `
                            <div class="card" onclick="abrirPasta(${index})">
                                <div class="cover-container">
                                    <img src="${item.capa_url}">
                                    <div class="hover-overlay"><button class="play-btn-icon" onclick="tocarMusica(event, '${item.titulo}', '${item.artista}', '${item.capa_url}', '${item.arquivo_url}')">▶</button></div>
                                </div>
                                <h3>${item.titulo}</h3>
                                <p>${item.artista}${txtF}</p>
                                <span class="tag">${item.tipo}</span>
                            </div>`;
                    }
                }
            });
        }
        function tocarMusica(event, t, a, c, u) {
            event.stopPropagation();
            document.getElementById("global-player").style.display = "flex";
            document.getElementById("p-capa").src = c;
            document.getElementById("p-titulo").innerText = t;
            document.getElementById("p-artista").innerText = a;
            const audio = document.getElementById("audio-elemento");
            audio.src = u; audio.play();
        }

            let artists = JSON.parse(localStorage.getItem("edp_artistas_v4") || "[]");
            const item = banco[idx];
            document.getElementById("music-modal").style.display = "flex";
            document.getElementById("m-capa").src = item.capa_url;
            document.getElementById("m-titulo").innerText = item.titulo;
            document.getElementById("m-artista").innerText = item.artista;

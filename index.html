<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>EDPMUZIK - Streaming</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #252525; padding: 15px; border-radius: 6px; text-align: center; }
        .card img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 4px; }
        .btn-action { background: #ff5500; border: none; color: white; padding: 5px 10px; margin: 5px; cursor: pointer; border-radius: 4px; }
        .suporte { background: #333; padding: 20px; margin-top: 40px; border-radius: 6px; }
    </style>
</head>
<body>

    <h1>EDPMUZIK - Plataforma de Streaming</h1>
    
    <!-- Filtros de Navegação -->
    <div style="margin-bottom: 20px;">
        <button class="btn-action" onclick="filtrar('Todos')">Todos</button>
        <button class="btn-action" onclick="filtrar('Album')">Álbuns</button>
        <button class="btn-action" onclick="filtrar('EP')">EPs</button>
        <button class="btn-action" onclick="filtrar('Mixtape')">Mixtapes</button>
    </div>

    <!-- Lista de Músicas -->
    <div class="grid" id="player-publico"></div>

    <!-- Área de Suporte Técnico Requisitada -->
    <div class="suporte">
        <h2>Contacto e Suporte Técnico</h2>
        <p>📞 Terminal Telefónico: <strong>926008439</strong></p>
        <p>📧 Correio Eletrónico: <strong>edpmuzik@gmail.com</strong></p>
        <hr>
        <h3>Enviar Mensagem Direta</h3>
        <input type="text" id="msgNome" placeholder="Seu Nome" style="width:100%; padding:8px; margin:5px 0;"><br>
        <textarea id="msgTexto" placeholder="Escreva a sua mensagem para o suporte..." rows="4" style="width:100%; padding:8px; margin:5px 0;"></textarea><br>
        <button class="btn-action" onclick="enviarSuporte()">Enviar Mensagem</button>
    </div>

    <script>
        let publicado = JSON.parse(localStorage.getItem('edp_publicado')) || [];

        function renderPublico(itens) {
            const container = document.getElementById('player-publico');
            container.innerHTML = '';

            if(itens.length === 0) {
                container.innerHTML = '<p>Nenhuma música publicada ainda.</p>';
                return;
            }

            itens.forEach(item => {
                container.innerHTML += `
                    <div class="card">
                        <img src="${item.linkCapa}" alt="Capa">
                        <h3>${item.titulo}</h3>
                        <p><strong>Músico:</strong> ${item.artista}</p>
                        <p><small>Projeto: ${item.tipoProjeto} (${item.tipoArtista})</small></p>
                        
                        <!-- Áudio Player -->
                        <audio src="${item.linkAudio}" controls style="width:100%;" onplay="contarStream(${item.id})"></audio>
                        
                        <!-- Métricas em Tempo Real -->
                        <div style="margin: 10px 0; font-size: 0.9em; color: #aaa;">
                            👁️ Streams: <span id="stream-${item.id}">${item.streams}</span> | 
                            📥 Downloads: <span id="down-${item.id}">${item.downloads}</span> | 
                            ❤️ Gostos: <span id="gosto-${item.id}">${item.gostos}</span>
                        </div>

                        <!-- Botões de Interação -->
                        <button class="btn-action" onclick="contarGosto(${item.id})">❤️ Gostrar</button>
                        <button class="btn-action" onclick="fazerDownload('${item.linkAudio}', ${item.id})">📥 Baixar MP3</button>
                        <button class="btn-action" onclick="alert('Biografia: ${item.biografia || "Não informada"}')">👤 Bio</button>
                    </div>
                `;
            });
        }

        function contarStream(id) {
            publicado = publicado.map(item => {
                if(item.id === id) {
                    item.streams += 1;
                    document.getElementById(`stream-${id}`).innerText = item.streams;
                }
                return item;
            });
            localStorage.setItem('edp_publicado', JSON.stringify(publicado));
        }

        function contarGosto(id) {
            publicado = publicado.map(item => {
                if(item.id === id) {
                    item.gostos += 1;
                    document.getElementById(`gosto-${id}`).innerText = item.gostos;
                }
                return item;
            });
            localStorage.setItem('edp_publicado', JSON.stringify(publicado));
        }

        function fazerDownload(url, id) {
            publicado = publicado.map(item => {
                if(item.id === id) {
                    item.downloads += 1;
                    document.getElementById(`down-${id}`).innerText = item.downloads;
                }
                return item;
            });
            localStorage.setItem('edp_publicado', JSON.stringify(publicado));
            window.open(url, '_blank');
        }

        function filtrar(tipo) {
            if(tipo === 'Todos') {
                renderPublico(publicado);
            } else {
                const filtrados = publicado.filter(item => item.tipoProjeto === tipo);
                renderPublico(filtrados);
            }
        }

        function enviarSuporte() {
            const nome = document.getElementById('msgNome').value;
            const texto = document.getElementById('msgTexto').value;
            if(!nome || !texto) return alert('Preencha os campos de mensagem.');
            
            alert(`Mensagem enviada com sucesso para edpmuzik@gmail.com!\n\nDe: ${nome}\nConteúdo: ${texto}`);
            document.getElementById('msgNome').value = '';
            document.getElementById('msgTexto').value = '';
        }

        // Inicializar a exibição
        renderPublico(publicado);
    </script>
</body>
</html>
